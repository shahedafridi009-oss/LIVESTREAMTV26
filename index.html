<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>all sports live stream tv 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #ff4b2b;
            --bg: #0f0c29;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: white;
            line-height: 1.6;
        }

        /* Full Screen Background */
        .hero-section {
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(15, 12, 41, 0.9), rgba(15, 12, 41, 0.9)), 
                        url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1450&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
        }

        /* Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            z-index: 100;
        }

        .logo { font-size: 24px; font-weight: 700; color: white; text-decoration: none; }
        .logo span { color: var(--accent); }

        nav { display: flex; gap: 20px; }
        nav a { color: #ddd; text-decoration: none; font-size: 13px; font-weight: 600; text-transform: uppercase; }

        /* Main Content */
        .main-container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }

        .text-area { flex: 1; }
        .text-area h1 { font-size: clamp(32px, 5vw, 55px); line-height: 1.1; margin-bottom: 20px; }
        .text-area h1 span { color: var(--primary); }
        .text-area p { font-size: 16px; color: #ccc; margin-bottom: 30px; }

        .btn-visit {
            display: inline-flex;
            align-items: center;
            background: var(--primary);
            color: #000;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 18px;
            transition: 0.3s;
        }
        .btn-visit:hover { background: #fff; transform: translateY(-3px); }

        /* Mobile Frame Section */
        .image-area { flex: 1; display: flex; gap: 20px; justify-content: center; }
        
        .phone {
            width: 200px;
            aspect-ratio: 9/19;
            background: #000;
            border: 8px solid #222;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: float 6s ease-in-out infinite;
        }
        .phone-2 { margin-top: 40px; animation-delay: 3s; }
        .phone img { width: 100%; height: 100%; object-fit: cover; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* --- RESPONSIVE FIX FOR MOBILE --- */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; text-align: center; }
            nav { gap: 10px; flex-wrap: wrap; justify-content: center; }
            
            .main-container {
                flex-direction: column; /* Mobile-e niche niche chole ashbe */
                text-align: center;
                padding-top: 20px;
            }

            .text-area { width: 100%; }
            .image-area { width: 100%; margin-top: 30px; }
            
            .phone { width: 160px; } /* Mobile-e phone frame ektu choto hobe */
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <header>
            <a href="#" class="logo">ALL SPORTS<span> LIVE</span> TV 2026.COM</a>
            <nav>
                <a href="#">Home</a>
                <a href="#">LIVE EVENTS</a>
                <a href="#">LIVE SPORTS</a>
                <a href="#">LIVE NEWS</a>
            </nav>
        </header>

        <div class="main-container">
            <div class="text-area">
                <h1>ALL SPORTS <span>TV.com</span></h1>
                <p>watch free sports live events live new live for free visit our website </p>
                
                <a href="hdsportstv24.live/all-sports-live-tv" class="btn-visit">
                    <i class="fas fa-play"></i> VISIT WEBSITE
                </a>
            </div>

            <div class="image-area">
                <div class="phone">
                    <img src="b.jpg" alt="Screen 1">
                </div>
                <div class="phone phone-2">
                    <img src="nn.jpg" alt="Screen 2">
                </div>
            </div>
        </div>
    </section>

</body>
</html>
